<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Casa Refúgio - Airbnb</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#14161c;color:#eee;font-family:sans-serif;overflow:hidden}
  button{font-family:inherit}
  #menu{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  #menu h1{margin:0 0 6px;font-size:44px}
  #menu p{margin:0 0 26px;opacity:.7;font-size:20px}
  .big{font-size:28px;padding:20px 36px;border-radius:16px;border:0;background:#2d6cdf;color:#fff;margin:10px;min-width:360px}
  .big:focus{outline:5px solid #ffd54a}
  #status{position:fixed;top:6px;left:10px;font-size:14px;z-index:30;opacity:.8}
  /* ---------- TV ---------- */
  #tv{position:fixed;top:0;left:0;right:0;bottom:0}
  #tv canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5}
  .panel{position:absolute;padding:2.2vh 2vw;background:rgba(15,20,28,.86);color:#fff;overflow:hidden;border:2px solid #14161c}
  .panel .title{font-size:5vh;font-weight:bold;margin-bottom:2vh}
  .panel .title span{font-size:2.6vh;color:#ffd166;font-weight:normal;margin-left:1vw}
  .panel .step{font-size:2.6vh;margin:1.2vh 0;line-height:1.35}
  .bigcode{font-size:13vh;font-weight:bold;letter-spacing:2vw;color:#ffd166;margin:1vh 0}
  .lobby .who{font-size:3.2vh;margin-top:2vh;font-weight:bold}
  .lmsg{color:#ff8a80;font-size:2.4vh}
  .home{display:flex;height:100%}
  .home .left{flex:1;padding-right:2vw;overflow:hidden}
  .home .right{width:42%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .home .qr{background:#fff;padding:1.2vh;border-radius:1.4vh;width:34vh;height:34vh}
  .home .qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
  .home .scan{font-size:2.8vh;font-weight:bold;margin:1.6vh 0 .6vh}
  .home .alt{font-size:1.9vh;opacity:.75;line-height:1.4}
  .home .codebox{font-size:6vh;font-weight:bold;letter-spacing:.8vw;color:#ffd166}
  .home .desc{font-size:2.1vh;line-height:1.4;margin:1vh 0}
  .home .desc b{color:#ffd166}
  .compact .home .qr{width:22vh;height:22vh}.compact .home .desc{display:none}
  .round{font-size:2.2vh;opacity:.7}
  .missing{font-size:4.4vh;font-weight:bold;color:#ffd166;margin:.6vh 0 1.4vh}
  .hint{font-size:2.6vh;line-height:1.35;margin:1vh 0;padding:1vh 1vw;background:rgba(255,255,255,.08);border-radius:1vh}
  .next{font-size:2vh;opacity:.6;margin-top:1vh}
  .timer{font-weight:bold;color:#fff}.timer.hot{color:#ff6b6b}
  .foundmsg.late{color:#ffb347}
  .foundmsg{font-size:3.6vh;font-weight:bold;color:#7ee081;margin-top:1.4vh}
  .scores{position:absolute;bottom:1.6vh;left:2vw;right:2vw;font-size:3vh;font-weight:bold}
  .view{position:absolute;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.32) 100%)}
  .vname{position:absolute;left:1vw;top:1vh;font-size:2.6vh;font-weight:bold;padding:.4vh 1vw;border-radius:1vh;color:#fff;text-shadow:0 0 3px #000}
  .vmsg{position:absolute;left:5%;right:5%;top:42%;text-align:center;font-size:3.4vh;font-weight:bold;background:rgba(0,0,0,.6);padding:1vh;border-radius:1vh}
  .vprompt{position:absolute;left:10%;right:10%;bottom:3vh;text-align:center;font-size:2.8vh;font-weight:bold;background:rgba(224,83,61,.92);padding:.8vh;border-radius:1vh}
  .sniff{position:absolute;right:1vw;top:1vh;width:28%;height:4vh;background:rgba(0,0,0,.55);border-radius:1vh;overflow:hidden}
  .sniff .sbar{height:100%;width:0}
  .sniff span{position:absolute;left:0;right:0;top:.6vh;text-align:center;font-size:2.4vh;font-weight:bold}
  .smallcode{position:absolute;right:1vw;bottom:.5vh;font-size:1.8vh;opacity:.6}
  .fps{position:absolute;left:1vw;bottom:.5vh;font-size:1.6vh;opacity:.4}
  #explore{position:fixed;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:10}
  #xstick{position:absolute;left:24px;bottom:24px;width:170px;height:170px;border-radius:50%;background:rgba(20,24,32,.45);border:3px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
  #xknob{position:absolute;left:47px;top:47px;width:70px;height:70px;border-radius:50%;background:rgba(91,140,255,.85);pointer-events:none}
  #xchar{position:absolute;right:14px;top:14px;pointer-events:auto;font-size:16px;padding:10px 14px;border-radius:12px;border:0;background:rgba(20,24,32,.7);color:#fff}
  #xstarts{position:absolute;left:14px;top:14px;pointer-events:auto}
  #xstarts button{display:block;margin-bottom:8px;font-size:16px;padding:10px 14px;border-radius:12px;border:0;color:#fff;font-weight:bold;background:#2fbf71}
  #xstart2{background:#e0883d !important}#xstart3{background:#3a9bd5 !important}
  #xhear{position:absolute;left:14px;top:14px;pointer-events:auto;font-size:15px;padding:9px 12px;border-radius:12px;border:0;background:#3a9bd5;color:#fff;font-weight:bold}
  #flash{position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none}
  #xA{position:absolute;right:28px;bottom:40px;width:96px;height:96px;border-radius:50%;border:0;background:rgba(224,83,61,.9);color:#fff;font-size:32px;font-weight:bold;pointer-events:auto;touch-action:none}
  #xA.down,#xJ.down{filter:brightness(1.5)}
  #xJ{position:absolute;right:138px;bottom:28px;width:70px;height:70px;border-radius:50%;border:0;background:rgba(58,123,213,.9);color:#fff;font-size:26px;font-weight:bold;pointer-events:auto;touch-action:none}
  .panel.solo{padding:10px 12px}
  .panel.solo .round{font-size:12px}.panel.solo .missing{font-size:19px;margin:4px 0 8px}
  .panel.solo .hint{font-size:14px;padding:6px 8px;margin:6px 0}.panel.solo .next{font-size:11px}
  .panel.solo .foundmsg{font-size:16px}.panel.solo .scores{font-size:14px;bottom:8px}
  /* ---------- PAD ---------- */
  #pad{position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none}
  #join,#choose,#ctl{height:100%;flex-direction:column}
  #join{align-items:center;justify-content:center}
  #join input{font-size:52px;width:230px;text-align:center;border-radius:14px;border:0;padding:8px;margin:14px 0}
  #choose{padding:40px 14px 14px}
  #choose h2{margin:0 0 12px;text-align:center}
  #chars{display:flex;flex-wrap:wrap;justify-content:center}
  .charbtn{width:44%;margin:2%;padding:18px 8px;border:0;border-radius:16px;color:#fff;font-size:22px;text-shadow:0 0 4px rgba(0,0,0,.6)}
  .charbtn small{display:block;font-size:13px;margin-top:6px;opacity:.95}
  #ctl{padding-top:30px}
  #top{display:flex;align-items:center;padding:0 12px}
  #meName{font-weight:bold;font-size:20px;padding:6px 12px;border-radius:10px}
  #meScore{margin-left:auto;font-size:20px;font-weight:bold}
  #info{flex:1;overflow:auto;padding:10px 14px}
  #info .ph{font-size:22px;font-weight:bold;color:#ffd166;margin:6px 0}
  #info .sub{font-size:15px;opacity:.8}
  #info .hint{font-size:16px;background:#232834;border-radius:10px;padding:8px 10px;margin:8px 0;line-height:1.35}
  #info .found{font-size:18px;color:#7ee081;font-weight:bold;margin-top:8px}
  #meMsg{text-align:center;min-height:22px;font-size:16px;color:#ffd166;padding:0 10px}
  #lobbyBtns{justify-content:center;padding:6px}
  #lobbyBtns{flex-wrap:wrap}
  #lobbyBtns button{font-size:17px;padding:12px 14px;margin-bottom:6px;border-radius:12px;border:0;margin:0 6px;color:#fff}
  #controls{display:flex;align-items:center;justify-content:space-around;padding:10px 0 26px;touch-action:none}
  #stick{width:210px;height:210px;border-radius:50%;background:#222833;border:3px solid #3a4252;position:relative;touch-action:none}
  #knob{width:86px;height:86px;border-radius:50%;background:#5b8cff;position:absolute;left:59px;top:59px;pointer-events:none}
  #abox{text-align:center;width:130px}
  #btnA{width:120px;height:120px;border-radius:50%;font-size:36px;background:#e0533d;border:0;color:#fff;touch-action:none;font-weight:bold}
  #btnA.down,#btnJ.down{filter:brightness(1.5)}
  #btnJ{width:76px;height:76px;border-radius:50%;font-size:26px;background:#3a7bd5;border:0;color:#fff;touch-action:none;font-weight:bold;display:block;margin:0 auto 12px}
  #aLabel{font-size:13px;min-height:34px;margin-top:6px;color:#ffb3a7}
</style>
</head>
<body>
<div id="status"></div>

<div id="menu" style="display:none">
  <h1>Casa Refúgio</h1>
  <p>caça ao tesouro em 3D</p>
  <button class="big" id="goPad">📱 Entrar no jogo da TV</button>
  <button class="big" id="goX" style="background:#e0883d">🏠 Jogar sozinho no celular</button>
  <button class="big" id="goTV" style="background:#444;font-size:18px;padding:12px 20px">📺 Esta tela é a TV</button>
</div>

<div id="tv" style="display:none"></div>
<div id="hud" style="display:none"></div>
<div id="explore" style="display:none">
  <div id="xstick"><div id="xknob"></div></div>
  <button id="xchar"></button>
  <div id="xstarts"><button id="xstart1">🔎 Sumiu!</button><button id="xstart2">🐶 Cadê o Marshal?</button><button id="xstart3">🐦 Passarinhos</button></div>
  <button id="xhear" style="display:none">🔊 Ouvir o canto</button>
  <div id="flash"></div>
  <button id="xJ">J</button>
  <button id="xA">A</button>
</div>

<div id="pad" style="display:none">
  <div id="join" style="display:none">
    <div style="font-size:22px">Código que aparece na TV:</div>
    <input id="codeIn" type="tel" maxlength="4" inputmode="numeric">
    <button class="big" id="joinBtn" style="min-width:220px">Entrar</button>
  </div>
  <div id="choose" style="display:none">
    <h2>Quem é você?</h2>
    <div id="chars"></div>
  </div>
  <div id="ctl" style="display:none">
    <div id="top"><span id="meName"></span><span id="meScore"></span></div>
    <div id="info"></div>
    <div id="meMsg"></div>
    <div style="text-align:center"><button id="hearBtn" style="display:none;font-size:16px;padding:10px 16px;border-radius:12px;border:0;background:#3a9bd5;color:#fff;margin:4px">🔊 Ouvir o canto</button></div>
    <div id="lobbyBtns" style="display:none">
      <button id="startBtn" style="background:#2fbf71">🔎 Sumiu!</button>
      <button id="startBtn2" style="background:#e0883d">🐶 Cadê o Marshal?</button>
      <button id="startBtn3" style="background:#3a9bd5">🐦 Passarinhos</button>
      <button id="swapBtn" style="background:#555">Trocar personagem</button>
    </div>
    <div id="controls">
      <div id="stick"><div id="knob"></div></div>
      <div id="abox"><button id="btnJ">J</button><button id="btnA">A</button><div id="aLabel"></div></div>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/resonance-audio.min.js"></script>
<script src="js/net.js?v=12"></script>
<script src="js/tex.js?v=12"></script>
<script src="js/chars.js?v=12"></script>
<script src="js/data.js?v=12"></script>
<script src="js/house.js?v=12"></script>
<script src="js/game.js?v=12"></script>
<script src="js/audio.js?v=12"></script>
<script src="js/pad.js?v=12"></script>
<script>
  var VERSION = 12;
  var started = false;
  function go(mode){
    if (started) return; started = true;
    try { if (mode !== 'tv') location.hash = mode; } catch (e) {}
    document.getElementById('menu').style.display = 'none';
    if (mode === 'tv' || mode === 'explorar') { document.getElementById('hud').style.display = 'block'; GAME.start({ explore: mode === 'explorar' }); } else PAD.start();
  }
  document.getElementById('goTV').onclick = function(){ go('tv'); };
  document.getElementById('goPad').onclick = function(){ go('pad'); };
  document.getElementById('goX').onclick = function(){ go('explorar'); };
  var ua = navigator.userAgent, isTV = /SMART-TV|SmartTV|Tizen|Web0S|webOS|BRAVIA|AFT|CrKey|HbbTV/i.test(ua), isPhone = !isTV && /Android|iPhone|iPad|Mobile/i.test(ua);
  var h = location.hash;
  if (/^#j\d{4}$/.test(h)) { window.JOIN_CODE = h.slice(2); go('pad'); }      // came from the TV's QR code
  else if (h === '#tv') go('tv'); else if (h === '#pad') go('pad'); else if (h === '#explorar') go('explorar');
  else if (isPhone) document.getElementById('menu').style.display = 'flex';    // phone opened the plain link
  else go('tv');                                                                // TV / computer: home page with QR code
</script>
</body>
</html>
